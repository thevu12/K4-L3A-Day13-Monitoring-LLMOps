alerts:
  - name: HighRequestLatency
    severity: critical
    condition: latency_p95 > 3000
    duration: 10m
    type: symptom-based
    channel: "slack:#llmops-alerts"
    owner: llm-platform
    runbook: docs/alerts.md#highrequestlatency
  - name: HighRequestErrorRate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: "slack:#llmops-alerts"
    owner: llm-platform
    runbook: docs/alerts.md#highrequesterrorrate
  - name: LowAnswerQuality
    severity: warning
    condition: quality_avg < 0.75
    duration: 15m
    type: symptom-based
    channel: "slack:#llmops-alerts"
    owner: ai-quality
    runbook: docs/alerts.md#lowanswerquality
